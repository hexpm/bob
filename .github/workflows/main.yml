name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    name: Test
    # A pull request from a branch in this repository tests the same commit
    # as the branch's push, so only pull requests from forks run here.
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      otp: 29.1.1
      elixir: 1.20.4
      MIX_ENV: test

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install OTP and Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ env.otp }}
          elixir-version: ${{ env.elixir }}

      - name: Restore dependencies
        id: deps-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-test-elixir-${{ env.elixir }}-otp-${{ env.otp }}-${{ hashFiles('mix.lock', 'config/config.exs', 'config/test.exs') }}
          restore-keys: ${{ runner.os }}-test-elixir-${{ env.elixir }}-otp-${{ env.otp }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Check for compiler warnings
        run: mix compile --warnings-as-errors

      # Only main writes the cache, which builds on every branch read. A
      # branch's entries would only be read by that branch, and count toward
      # the repository's 10 GB cache limit along with main's.
      - name: Save dependencies
        if: ${{ github.ref == 'refs/heads/main' && steps.deps-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      - name: Check mix format
        run: mix format --check-formatted

      - name: Set up the database
        run: mix ecto.create && mix ecto.migrate

      - name: Run tests
        run: mix test --warnings-as-errors

  docker:
    name: Docker
    # A pull request from a branch in this repository builds the same commit
    # as the branch's push, so only pull requests from forks build here.
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20

    permissions:
      contents: 'read'
      id-token: 'write'

    env:
      IMAGE_NAME: 'bob'
      PROJECT_ID: 'hexpm-prod'
      SERVICE_ACCOUNT: ${{ secrets.GCLOUD_SERVICE_ACCOUNT }}
      WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCLOUD_WORKFLOW_IDENTITY_POOL_PROVIDER }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

    # No checkout: without a context, build-push-action builds from the
    # commit's Git URL, so BuildKit fetches the source itself.
    steps:
      - name: Set short git commit SHA
        run: echo "COMMIT_SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Google auth
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        if: ${{ github.event_name != 'pull_request' && env.SERVICE_ACCOUNT != '' }}
        with:
          token_format: 'access_token'
          project_id: ${{ env.PROJECT_ID }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}

      - name: Docker Auth
        id: docker-auth
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: ${{ github.event_name != 'pull_request' && env.SERVICE_ACCOUNT != '' }}
        with:
          registry: gcr.io
          username: 'oauth2accesstoken'
          password: '${{ steps.auth.outputs.access_token }}'

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: linux/arm64
          tags: gcr.io/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}:${{ env.COMMIT_SHORT_SHA }}
          build-args: |
            GIT_SHA=${{ env.COMMIT_SHORT_SHA }}
            GIT_AUTHOR=${{ github.event.head_commit.author.name }}
          push: ${{ github.event_name != 'pull_request' && env.SERVICE_ACCOUNT != '' }}
          # Only main writes the cache, which builds on every branch read. A
          # branch's entries would only be read by that branch, and count
          # toward the repository's 10 GB cache limit along with main's.
          cache-from: type=gha
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max' || '' }}

      # The release version is the image tag; the app sends the same value
      # from the baked GIT_SHA, and the hexpm-ops deploy registers when it
      # reaches an environment. The refs association needs the repository
      # linked to the Sentry GitHub integration; fall back to a bare release
      # so a missing link degrades commit tracking, not CI.
      - name: Create Sentry release
        if: ${{ github.event_name != 'pull_request' && env.SERVICE_ACCOUNT != '' && env.SENTRY_AUTH_TOKEN != '' }}
        run: |
          api="https://sentry.io/api/0/organizations/hexpm/releases/"
          refs_payload=$(printf '{"version": "%s", "projects": ["bob"], "refs": [{"repository": "hexpm/bob", "commit": "%s"}]}' "$COMMIT_SHORT_SHA" "$GITHUB_SHA")
          bare_payload=$(printf '{"version": "%s", "projects": ["bob"]}' "$COMMIT_SHORT_SHA")
          curl -sf -X POST "$api" \
            -H "Authorization: Bearer $SENTRY_AUTH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$refs_payload" ||
            curl -sf -X POST "$api" \
              -H "Authorization: Bearer $SENTRY_AUTH_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$bare_payload"
